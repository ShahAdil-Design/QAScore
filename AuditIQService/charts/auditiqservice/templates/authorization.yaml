apiVersion: "security.istio.io/v1beta1"
kind: AuthorizationPolicy
metadata:
  name: {{ include "helpers.name" . }}-authz-allow-token
  namespace: {{ include "helpers.namespace" . }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "helpers.name" . }}
  rules:
    - from:
      - source:
          principals:
            {{- range .Values.authorization.validSourcePrincipals }}
              - {{ . | quote }}
            {{- end }}
      when:
      - key: request.auth.claims[iss]
        values:
          {{- range .Values.authorization.validIssuers }}
            - {{ . | quote }}
          {{- end }}
---
apiVersion: "security.istio.io/v1beta1"
kind: AuthorizationPolicy
metadata:
  name: {{ include "helpers.name" . }}-authz-allow-anonymous
  namespace: {{ include "helpers.namespace" . }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "helpers.name" . }}
  rules:
    - to:
      - operation:
          methods: ["OPTIONS"]
