# disable content-type sniffing on some browsers.
add_header X-Content-Type-Options nosniff;

# No embedded payment/3rd-party iframes in this app, except Entra ID's own hidden iframe for
# MSAL's silent token acquisition/renewal (acquireTokenSilent) — without it, sign-in never
# resolves and every screen behaves as if no user is logged in. frame-src 'self' is required
# because MSAL's silent flow completes by redirecting that same hidden iframe back to this app's
# own origin (carrying the auth response). frame-ancestors must allow 'self' too (not just
# 'none') for the same reason — that hidden iframe embeds this app inside itself, and
# frame-ancestors governs who may frame US, same direction as X-Frame-Options SAMEORIGIN below.
add_header Content-Security-Policy "frame-ancestors 'self'; frame-src 'self' https://login.microsoftonline.com;";

# stop clickjacking attacks
add_header X-Frame-Options SAMEORIGIN;

# Explicit default referrer behaviour.
#   1. Origin, path, and query for same origin
#   2. Origin only for cross-origin HTTPS->HTTPS
#   3. No referrer for cross-origin HTTPS->HTTP
add_header Referrer-Policy strict-origin-when-cross-origin;

# enforce HTTPS
add_header Strict-Transport-Security "max-age=31536000;includeSubDomains";
