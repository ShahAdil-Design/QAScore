
# auto detects a good number of processes to run
worker_processes auto;

#Provides the configuration file context in which the directives that affect connection processing are specified.
events {
    # Sets the maximum number of simultaneous connections that can be opened by a worker process.
    worker_connections 8000;
    # Tells the worker to accept multiple connections at a time
    multi_accept on;
}


http {
    # what times to include
    include       /etc/nginx/mime.types;
    # what is the default one
    default_type  application/octet-stream;

    # Sets the path, format, and configuration for a buffered log write
    log_format compression '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $upstream_addr '
        '"$http_referer" "$http_user_agent"';

    server {
        # listen on port 80
        listen 80;
        # save logs here
        access_log /var/log/nginx/access.log compression;

        root /app;

        # what file to server as index
        index index.html index.htm;

        gzip on;
        gzip_comp_level    5;
        gzip_min_length    1024;
        gzip_proxied       any;
        gzip_vary          on;

        gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/pdf
        application/x-font-woff
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/x-component
        text/x-cross-domain-policy;
        # text/html is always compressed by gzip module

        # Route to advertise that the node is healthy in a load balancer
        location /health {
            include nginx.security.conf;

            access_log off;
            default_type application/json;
            expires 0;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            return 200 '{"status":"Healthy"}';
        }

        location / {
            include nginx.security.conf;

            # First attempt to serve request as file, then
            # as directory, then fall back to redirecting to index.html
            try_files $uri $uri/ /index.html;
            expires 0;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location ~ (index.html)$ {
            include nginx.security.conf;

            add_header Last-Modified $date_gmt;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
            if_modified_since off;
            expires off;
            etag off;
        }

        location ~ (sw.js|\/config\/appsettings.config.json)$ {
            include nginx.security.conf;

            add_header Last-Modified $date_gmt;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
            if_modified_since off;
            expires off;
            etag off;
            access_log off;
        }

        # We don't currently have these icons, but iOS devices request them regardless
        # Until these are added we'll supress 404 log errors
        location ~ (/apple-touch-icon(|-\d+x\d+)(|-precomposed).png|favicon(|-\d+x\d+).(ico|png)) {
          include nginx.security.conf;

          log_not_found off;
        }

        # Media: images, icons, fonts
        location ~* \.(?:jpg|jpeg|gif|png|ico|cur|svg|woff|woff2)$ {
          include nginx.security.conf;

          expires 1M;
          access_log off;
          add_header Cache-Control "public";
        }

        # Javascript, CSS and map files
        location ~* \.(?:css|js|map)$ {
            include nginx.security.conf;

            try_files $uri =404;
            expires 1y;
            access_log off;
            add_header Cache-Control "public";
        }

        # Any route containing a file extension (e.g. /devicesfile.js)
        location ~ ^.+\..+$ {
            include nginx.security.conf;

            try_files $uri =404;
        }
    }
}
